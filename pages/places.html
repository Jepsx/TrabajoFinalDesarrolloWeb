<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../img/favicon.webp" type="image/webp"/>

    <title>Lugares - Conoce Brasil</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">
                <a href="../index.html"> 
                    <img src="../img/icon.webp" alt="Logo Turismo Brasil" >
                </a>
            </div>
            
            <nav class="nav-desktop" aria-label="Navegación principal">
                <a href="../index.html" data-i18n="navHome">Inicio</a>
                <a href="food.html" data-i18n="navFood">Comida</a>
                <a href="requirements.html" data-i18n="navReq">Requisitos</a>

                <button id="lang-toggle-desktop" class="lang-btn" aria-label="Cambiar idioma">
                    <img id="flag-icon-desktop" src="https://flagcdn.com/w40/co.png" alt="Bandera de colombia">
                </button>
            </nav>

            <button id="mobile-menu-button" class="mobile-menu-btn" aria-label="Abrir menú">
                <i data-lucide="menu"></i>
            </button>
        </div>

        <nav id="mobile-menu" class="mobile-nav" aria-label="Móvil">
                <a href="../index.html" data-i18n="navHome">Inicio</a>
                <a href="food.html" data-i18n="navFood">Comida</a>
                <a href="requirements.html" data-i18n="navReq">Requisitos</a>
            <div class="mobile-lang-row">
                <span data-i18n="navLang">Idioma:</span>
                <button id="lang-toggle-mobile" class="lang-btn">
                    <img id="flag-icon-mobile" src="https://flagcdn.com/w40/co.png" alt="Español">
                </button>
            </div>
        </nav>
    </header>

    <main id="contenido-principal" style="padding: 40px 20px; max-width: 1200px; margin: 0 auto;">
        <h1 data-i18n="placesTitle" style="color: var(--brand-blue); margin-bottom: 30px; text-align: center;">Destinos Imperdibles</h1>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px;">
            <article class="glass-card" style="margin-bottom: 0;">
                <figure>
                    <picture>
                        <source srcset="../img/mobile_mountain-botafogo-beach-rio-de-janeiro-brazil.webp" media="(max-width: 768px)">
                        <img src="../img/mountain-botafogo-beach-rio-de-janeiro-brazil 1.webp" 
                        alt="Playa de Botafogo con barcos anclados y el Pan de Azúcar al fondo" 
                        style="width: 100%; height: 200px; object-fit: cover; border-radius: 4px;" fetchpriority="high">
                    </picture>
                    <figcaption style="margin-top: 15px;">
                        <h2 data-i18n="rioTitle"style="color: var(--brand-blue);">Río de Janeiro</h2>
                        <p data-i18n="rioDesc"style="color: var(--gray-text);">La "Ciudad Maravillosa", famosa por el Cristo Redentor y sus playas icónicas de Copacabana e Ipanema.</p>
                    </figcaption>
                </figure>
            </article>

            <article class="glass-card" style="margin-bottom: 0;">
                <figure>
                    <picture>
                        <source srcset="../img/mobile_iguazu.webp" media="(max-width: 768px)">

                        <img src="../img/iguazu.webp" 
                        alt="Cataratas del Iguazú mostrando múltiples caídas de agua con un arcoíris" 
                        style="width: 100%; height: 200px; object-fit: cover; border-radius: 4px;">
                    </picture>
                    <figcaption style="margin-top: 15px;">
                        <h2 data-i18n="iguazuTitle" style="color: var(--brand-blue);">Cataratas del Iguazú</h2>
                        <p data-i18n="iguazuDesc" style="color: var(--gray-text);">Una de las siete maravillas naturales del mundo, situada en la frontera entre Brasil y Argentina.</p>
                    </figcaption>
                </figure>
            </article>

            <article class="glass-card" style="margin-bottom: 0;">
                <figure>
                    <picture>
                        <source srcset="../img/mobile_saoPaulo.webp" media="(max-width: 768px)">

                        <img src="../img/saoPaulo.webp" 
                        alt="Vista panorámica de rascacielos y el puente atirantado Octávio Frias de Oliveira en São Paulo" 
                        style="width: 100%; height: 200px; object-fit: cover; border-radius: 4px;">
                    </picture>
                    <figcaption style="margin-top: 15px;">
                        <h2 data-i18n="spTitle" style="color: var(--brand-blue);">São Paulo</h2>
                        <p data-i18n="spDesc" style="color: var(--gray-text);">El centro económico y cultural del país, conocido por su vibrante vida nocturna y museos de arte.</p>
                    </figcaption>
                </figure>
            </article>
        </div>
    </main>

    <footer>
        <p data-i18n="footer">&copy; 2026 Turismo Brasil. Todos los derechos reservados.</p>
    </footer>
    <script>lucide.createIcons();</script>
    <script src="../scripts/translations.js"></script>
    <script src="../scripts/menu_lenguage.js"></script>
</body>
</html>
